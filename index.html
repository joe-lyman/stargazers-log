<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A log of repositories I've starred on GitHub.">
    <title>Starred repositories</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <p class="eyebrow">GitHub collection</p>
        <h1>Starred repositories</h1>
        <p class="intro">A growing list of projects worth keeping an eye on.</p>
      </header>
      <section aria-labelledby="repositories-heading">
        <h2 id="repositories-heading" class="section-heading">The collection</h2>
        <p id="list-status" class="list-status" role="status" aria-live="polite">Loading repositories…</p>
        <ul id="repository-list" class="repository-list"></ul>
      </section>
    </main>
  </body>
</html>
